<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lid Registratie</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:40px;
      background:#f4f6f9;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:600px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    .form-group{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      background:#0d6efd;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#0b5ed7;
    }

    .success{
      margin-top:15px;
      padding:12px;
      background:#d1e7dd;
      color:#0f5132;
      border-radius:8px;
      display:none;
    }

    .error{
      margin-top:15px;
      padding:12px;
      background:#f8d7da;
      color:#842029;
      border-radius:8px;
      display:none;
    }

    .loading{
      margin-top:15px;
      text-align:center;
      display:none;
    }

  </style>

</head>
<body>

  <div class="container">

    <h1>Lid Registratie</h1>

    <div class="form-group">
      <label>Naam</label>
      <input type="text" id="naam">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email">
    </div>

    <div class="form-group">
      <label>Telefoon</label>
      <input type="text" id="telefoon">
    </div>

    <div class="form-group">
      <label>Lidmaatschap</label>

      <select id="lidmaatschap">
        <option value="Basic">Basic</option>
        <option value="Premium">Premium</option>
        <option value="VIP">VIP</option>
      </select>
    </div>

    <div class="form-group">
      <label>Startdatum</label>
      <input type="date" id="startdatum">
    </div>

    <button onclick="opslaan()">
      Opslaan
    </button>

    <div class="loading" id="loading">
      Opslaan...
    </div>

    <div class="success" id="success">
      Lid succesvol opgeslagen.
    </div>

    <div class="error" id="error">
      Fout bij opslaan.
    </div>

  </div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwN9plrbS-rDOX4ZAMDbL9smBop9eJy3V7gYfbEVsxAdxKlmz9f4ps3QIAKwD2A1EvvPw/exec";

async function opslaan() {

  document.getElementById("success").style.display = "none";
  document.getElementById("error").style.display = "none";
  document.getElementById("loading").style.display = "block";

  const naam = document.getElementById("naam").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefoon = document.getElementById("telefoon").value.trim();
  const lidmaatschap = document.getElementById("lidmaatschap").value;
  const startdatum = document.getElementById("startdatum").value;

  // VALIDATIE

  if(
    naam === "" ||
    email === "" ||
    telefoon === "" ||
    lidmaatschap === "" ||
    startdatum === ""
  ){
    alert("Vul alle velden in");
    document.getElementById("loading").style.display = "none";
    return;
  }

  // EMAIL VALIDATIE

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if(!emailRegex.test(email)){
    alert("Voer een geldig emailadres in");
    document.getElementById("loading").style.display = "none";
    return;
  }

  // TELEFOON VALIDATIE

  const telefoonRegex = /^[0-9]{10}$/;

  if(!telefoonRegex.test(telefoon)){
    alert("Telefoonnummer moet exact 10 cijfers bevatten");
    document.getElementById("loading").style.display = "none";
    return;
  }

  const data = {
    naam,
    email,
    telefoon,
    lidmaatschap,
    startdatum
  };

  try {

    await fetch(SCRIPT_URL, {

      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data),
      headers: {
        "Content-Type": "text/plain"
      }

    });

    document.getElementById("success").style.display = "block";

    document.getElementById("naam").value = "";
    document.getElementById("email").value = "";
    document.getElementById("telefoon").value = "";
    document.getElementById("startdatum").value = "";

  } catch(error) {

    console.error(error);

    document.getElementById("error").style.display = "block";

  }

  document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
