<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lidmaatschappen</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:40px;
      background:#f4f6f9;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:600px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
      margin-top:0;
      text-align:center;
      color:#333;
    }

    .form-group{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
      color:#444;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      background:#0d6efd;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      background:#0b5ed7;
    }

    .success{
      margin-top:15px;
      padding:12px;
      background:#d1e7dd;
      color:#0f5132;
      border-radius:8px;
      display:none;
    }

    .error{
      margin-top:15px;
      padding:12px;
      background:#f8d7da;
      color:#842029;
      border-radius:8px;
      display:none;
    }

    .loading{
      text-align:center;
      margin-top:15px;
      display:none;
      color:#555;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Lid Registratie</h1>

  <div class="form-group">
    <label for="naam">Naam</label>
    <input type="text" id="naam" placeholder="Naam">
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Email">
  </div>

  <div class="form-group">
    <label for="telefoon">Telefoon</label>
    <input type="text" id="telefoon" placeholder="Telefoonnummer">
  </div>

  <div class="form-group">
    <label for="lidmaatschap">Lidmaatschap</label>
    <select id="lidmaatschap">
      <option value="Basic">Basic</option>
      <option value="Premium">Premium</option>
      <option value="VIP">VIP</option>
    </select>
  </div>

  <div class="form-group">
    <label for="startdatum">Startdatum</label>
    <input type="date" id="startdatum">
  </div>

  <button onclick="opslaan()">Opslaan</button>

  <div class="loading" id="loading">
    Opslaan...
  </div>

  <div class="success" id="success">
    Lid succesvol opgeslagen.
  </div>

  <div class="error" id="error">
    Fout bij opslaan.
  </div>

</div>

<script>

  // PLAK HIER JE GOOGLE APPS SCRIPT URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwN9plrbS-rDOX4ZAMDbL9smBop9eJy3V7gYfbEVsxAdxKlmz9f4ps3QIAKwD2A1EvvPw/exec";

  async function opslaan() {

    document.getElementById("success").style.display = "none";
    document.getElementById("error").style.display = "none";
    document.getElementById("loading").style.display = "block";

    const data = {
      naam: document.getElementById("naam").value,
      email: document.getElementById("email").value,
      telefoon: document.getElementById("telefoon").value,
      lidmaatschap: document.getElementById("lidmaatschap").value,
      startdatum: document.getElementById("startdatum").value
    };

    try {

      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      });

      const result = await response.json();

      if(result.status === "success"){

        document.getElementById("success").style.display = "block";

        document.getElementById("naam").value = "";
        document.getElementById("email").value = "";
        document.getElementById("telefoon").value = "";
        document.getElementById("startdatum").value = "";

      } else {

        document.getElementById("error").style.display = "block";

      }

    } catch(error) {

      console.error(error);

      document.getElementById("error").style.display = "block";

    }

    document.getElementById("loading").style.display = "none";
  }

</script>

</body>
</html>
